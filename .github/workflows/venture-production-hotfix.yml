name: Apply venture production hotfix

on:
  push:
    paths:
      - ".github/workflows/venture-production-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply venture production hotfix
        run: python scripts/apply-venture-hotfix.py

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/CreateProfileForm.tsx components/VentureWorkspace.tsx components/AdminDashboard.tsx components/DiscoverClient.tsx app/ventures.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: stabilize ventures and redesign venture cards"
          git push origin HEAD:main
