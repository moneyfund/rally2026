name: Apply venture production hotfix

on:
  push:
    paths:
      - ".github/workflows/venture-production-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch venture flows and cards
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Pattern not found: {label}")
              return text.replace(old, new, 1)

          # ------------------------------------------------------------
          # CreateProfileForm: create a compatible base profile first.
          # ------------------------------------------------------------
          path = Path("components/CreateProfileForm.tsx")
          text = path.read_text()
          text = replace_once(
              text,
              'import { doc, getDoc, serverTimestamp, writeBatch } from "firebase/firestore";',
              'import { doc, getDoc, serverTimestamp, setDoc, writeBatch } from "firebase/firestore";',
              "CreateProfileForm firestore import",
          )
          text = replace_once(
              text,
              '''        legalName: kind === "empresa" ? legalName : "",
        companyEmail: kind === "empresa" ? companyEmail : "",
        website: kind === "empresa" ? website : "",
        representativeName: kind === "empresa" ? representativeName : "",
        representativeRole: kind === "empresa" ? representativeRole : "",
''',
              '''        ...(kind === "empresa" ? {
          legalName,
          companyEmail,
          website,
          representativeName,
          representativeRole,
        } : {}),
''',
              "conditional company fields",
          )
          text = replace_once(
              text,
              '''        products,
        ventureNeeds: kind === "negocio" ? ventureNeeds : [],
''',
              '',
              "defer venture enrichment",
          )
          text = replace_once(
              text,
              '''      await batch.commit();
      profileSaved = true;

      setRegisteredEmail(email);
''',
              '''      await batch.commit();
      profileSaved = true;

      if (kind === "negocio") {
        try {
          await setDoc(profileRef, {
            products,
            ventureNeeds,
            updatedAt: serverTimestamp(),
          }, { merge: true });
        } catch (enrichmentError) {
          console.warn("El perfil base fue creado, pero Firebase rechazó temporalmente los campos avanzados del emprendimiento.", enrichmentError);
        }
      }

      setRegisteredEmail(email);
''',
              "venture enrichment after create",
          )
          path.write_text(text)

          # ------------------------------------------------------------
          # VentureWorkspace: always save core profile, then enrich.
          # ------------------------------------------------------------
          path = Path("components/VentureWorkspace.tsx")
          text = path.read_text()
          if 'VentureCoverUploader' not in text:
              text = replace_once(
                  text,
                  'import type { VentureProduct } from "@/lib/profile-types";\n',
                  'import type { VentureProduct } from "@/lib/profile-types";\nimport { VentureCoverUploader } from "@/components/VentureCoverUploader";\n',
                  "VentureWorkspace uploader import",
              )
          text = replace_once(
              text,
              '''        products,
        ventureNeeds: form.ventureNeeds,
''',
              '',
              "VentureWorkspace defer enrichment",
          )
          text = replace_once(
              text,
              '''      }, { merge: true });

      setForm((current) => ({ ...current, services, products }));
''',
              '''      }, { merge: true });

      try {
        await setDoc(profileRef, {
          products,
          ventureNeeds: form.ventureNeeds,
          updatedAt: serverTimestamp(),
        }, { merge: true });
      } catch (enrichmentError) {
        console.warn("Perfil base guardado; los campos avanzados del emprendimiento requieren las reglas Firestore actuales.", enrichmentError);
      }

      setForm((current) => ({ ...current, services, products }));
''',
              "VentureWorkspace enrichment",
          )
          text = replace_once(
              text,
              '''          {notice ? <div className="profile-notice"><Check size={17} /> {notice}</div> : null}
          {error ? <div className="form-error" role="alert">{error}</div> : null}

          <section id="informacion"''',
              '''          {notice ? <div className="profile-notice"><Check size={17} /> {notice}</div> : null}
          {error ? <div className="form-error" role="alert">{error}</div> : null}

          <VentureCoverUploader uid={user.uid} />

          <section id="informacion"''',
              "VentureWorkspace uploader render",
          )
          path.write_text(text)

          # ------------------------------------------------------------
          # AdminDashboard: load applications from each job subcollection
          # instead of a collection-group query that can deny the whole UI.
          # ------------------------------------------------------------
          path = Path("components/AdminDashboard.tsx")
          text = path.read_text()
          pattern = re.compile(
              r'''        cleanups\.push\(onSnapshot\(collection\(db, "jobPosts"\), \(snapshot\) => \{.*?        cleanups\.push\(onSnapshot\(collectionGroup\(db, "applications"\), \(snapshot\) => \{.*?        \}, \(caught\) => setError\(firebaseMessage\(caught\)\)\)\);\n''',
              re.S,
          )
          replacement = '''        cleanups.push(onSnapshot(collection(db, "jobPosts"), async (snapshot) => {
          if (!active) return;
          const nextJobs = snapshot.docs.map((item) => jobFromDoc(item.id, item.data()));
          setJobs(nextJobs);

          try {
            const applicationSnapshots = await Promise.all(
              snapshot.docs.map((jobDoc) => getDocs(collection(db, "jobPosts", jobDoc.id, "applications")))
            );
            if (!active) return;
            const nextApplications: JobApplication[] = applicationSnapshots.flatMap((applicationSnapshot) =>
              applicationSnapshot.docs.map((item) => ({
                id: item.id,
                jobId: String(item.data().jobId ?? item.ref.parent.parent?.id ?? ""),
                jobTitle: String(item.data().jobTitle ?? "Vacante"),
                companyId: String(item.data().companyId ?? ""),
                applicantId: String(item.data().applicantId ?? ""),
                applicantName: String(item.data().applicantName ?? "Postulante"),
                applicantEmail: String(item.data().applicantEmail ?? ""),
                applicantPhone: String(item.data().applicantPhone ?? ""),
                applicantProfileId: String(item.data().applicantProfileId ?? ""),
                message: String(item.data().message ?? ""),
                status: item.data().status === "viewed" || item.data().status === "shortlisted" || item.data().status === "rejected" ? item.data().status : "sent",
                createdAt: item.data().createdAt,
              }))
            );
            setApplications(nextApplications);
          } catch (caught) {
            console.warn("No se pudieron cargar las postulaciones; el resto de la consola sigue disponible.", caught);
            if (active) setApplications([]);
          }
        }, (caught) => setError(firebaseMessage(caught))));
'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("AdminDashboard application listener block not found")
          path.write_text(text)

          # ------------------------------------------------------------
          # DiscoverClient: image-led venture cards + static reference art.
          # ------------------------------------------------------------
          path = Path("components/DiscoverClient.tsx")
          text = path.read_text()
          text = replace_once(
              text,
              '''  avatarUrl: string;
  verified: boolean;
''',
              '''  avatarUrl: string;
  coverUrl: string;
  verified: boolean;
''',
              "DirectoryProfile coverUrl",
          )
          text = replace_once(
              text,
              '''      avatarUrl: String(data.avatarUrl ?? data.googlePhotoUrl ?? ""),
      verified: data.verified === true || data.verificationStatus == null,
''',
              '''      avatarUrl: String(data.avatarUrl ?? data.googlePhotoUrl ?? ""),
      coverUrl: String(data.coverUrl ?? ""),
      verified: data.verified === true || data.verificationStatus == null,
''',
              "snapshot coverUrl",
          )
          marker = 'const demoDirectory: DirectoryProfile[] = demoProfiles.map((profile) => ({\n'
          if 'DEMO_VENTURE_COVERS' not in text:
              text = replace_once(
                  text,
                  marker,
                  '''const DEMO_VENTURE_COVERS: Record<number, string> = {
  4: "https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=1200&q=82",
  5: "https://images.unsplash.com/photo-1452860606245-08befc0ff44b?auto=format&fit=crop&w=1200&q=82",
  7: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=82",
  8: "https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1200&q=82",
};

''' + marker,
                  "demo venture covers",
              )
          text = replace_once(
              text,
              '''  avatarUrl: "",
  verified: Boolean(profile.verified),
''',
              '''  avatarUrl: "",
  coverUrl: profile.kind === "negocio" ? DEMO_VENTURE_COVERS[profile.id] ?? "" : "",
  verified: Boolean(profile.verified),
''',
              "demo cover mapping",
          )
          tail_pattern = re.compile(r'function VentureDirectoryCard\(\{ profile \}: \{ profile: DirectoryProfile \}\) \{.*\Z', re.S)
          tail_replacement = '''function VentureDirectoryCard({ profile }: { profile: DirectoryProfile }) {
  const href = profile.uid ? `/perfil/${profile.uid}` : undefined;
  const products = profile.products.length ? profile.products : profile.skills;
  const cardImage = profile.coverUrl || profile.avatarUrl;
  const content = <>
    <div className="venture-directory-visual">
      {cardImage ? <img src={cardImage} alt={`Imagen de ${profile.name}`} /> : <div className="venture-directory-visual-fallback"><Store size={34} /><span>{profile.category}</span></div>}
      <span className="venture-directory-visual-icon"><Store size={21} /></span>
      {profile.verified ? <em className="venture-directory-verified"><BadgeCheck size={15} /> Verificado</em> : null}
    </div>
    <div className="venture-directory-content">
      <div className="venture-directory-head">
        <div><span>EMPRENDIMIENTO</span><h3>{profile.name}</h3><p><Store size={14} /> {profile.category}</p></div>
      </div>
      <div className="venture-directory-location"><MapPin size={15} /> {profile.location}</div>
      <p className="venture-directory-description">{profile.description}</p>
      <div className="venture-directory-products"><strong>Productos</strong>{products.length ? <ul>{products.slice(0, 3).map((product) => <li key={product}>{product}</li>)}</ul> : <span>Próximamente más información.</span>}</div>
      <div className="venture-directory-needs"><strong><Handshake size={15} /> Busca:</strong>{profile.ventureNeeds.length ? <div>{profile.ventureNeeds.slice(0, 3).map((need) => <span key={need}>{need}</span>)}</div> : <span>Conexiones y oportunidades</span>}</div>
      <div className="venture-directory-footer"><span>{profile.role}</span><strong>{href ? "Ver emprendimiento" : "Perfil demostrativo"} {href ? <ArrowRight size={14} /> : null}</strong></div>
    </div>
  </>;
  return href ? <Link href={href} className="venture-directory-card">{content}</Link> : <article className="venture-directory-card">{content}</article>;
}
'''
          text, count = tail_pattern.subn(tail_replacement, text, count=1)
          if count != 1:
              raise SystemExit("VentureDirectoryCard tail not found")
          path.write_text(text)

          # ------------------------------------------------------------
          # CSS overrides for the Amy Blandon-inspired split cards.
          # ------------------------------------------------------------
          path = Path("app/ventures.css")
          text = path.read_text()
          if 'VENTURE IMAGE-LED CARD V2' not in text:
              text += '''

/* VENTURE IMAGE-LED CARD V2 */
.venture-directory-card {
  display: grid;
  grid-template-columns: minmax(0,.92fr) minmax(0,1.08fr);
  gap: 0;
  padding: 0;
  min-height: 430px;
  overflow: hidden;
  border-radius: 24px;
  background: #fff;
}
.venture-directory-visual { position: relative; min-height: 100%; overflow: hidden; background: #dfe7e9; }
.venture-directory-visual::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg,rgba(7,29,54,.10),rgba(255,255,255,.03) 55%,rgba(255,255,255,.72) 100%); pointer-events: none; }
.venture-directory-visual > img { width: 100%; height: 100%; min-height: 430px; display: block; object-fit: cover; transition: transform .45s ease; }
.venture-directory-card:hover .venture-directory-visual > img { transform: scale(1.035); }
.venture-directory-visual-fallback { height: 100%; min-height: 430px; display: grid; place-items: center; align-content: center; gap: 10px; background: linear-gradient(145deg,#163b58,#6b8d62); color: #fff; }
.venture-directory-visual-fallback span { font-size: 11px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; }
.venture-directory-visual-icon { position: absolute; z-index: 2; right: -28px; top: 34px; width: 66px; height: 66px; display: grid; place-items: center; border: 6px solid #fff; border-radius: 50%; background: #071d36; color: #9fc65d; box-shadow: 0 12px 30px rgba(7,29,54,.2); }
.venture-directory-verified { position: absolute; z-index: 2; left: 17px; bottom: 17px; display: inline-flex; align-items: center; gap: 5px; padding: 8px 10px; border-radius: 999px; background: rgba(7,29,54,.86); color: #fff; font-size: 10px; font-style: normal; font-weight: 900; backdrop-filter: blur(9px); }
.venture-directory-content { min-width: 0; display: flex; flex-direction: column; gap: 15px; padding: 31px 28px 25px 34px; background: linear-gradient(90deg,#fff 0%,#fff 72%,#fbfcfd 100%); }
.venture-directory-head { display: block; }
.venture-directory-head > div > span { color: #6d9f40; }
.venture-directory-head h3 { margin-top: 3px; font-size: 23px; }
.venture-directory-location { margin-top: -3px; }
.venture-directory-description { padding: 0; border-left: 0; font-size: 13px; line-height: 1.62; }
.venture-directory-products { padding-top: 4px; }
.venture-directory-products ul { padding-left: 18px; }
.venture-directory-needs { margin-top: auto; }
.venture-directory-footer { padding-top: 14px; }

.venture-cover-editor { overflow: hidden; display: grid; grid-template-columns: minmax(260px,.8fr) minmax(0,1.2fr); border: 1px solid #dce5ec; border-radius: 22px; background: #fff; box-shadow: 0 12px 32px rgba(7,29,54,.04); }
.venture-cover-preview { min-height: 235px; overflow: hidden; background: linear-gradient(145deg,#dfe9ed,#eef3f5); }
.venture-cover-preview > img { width: 100%; height: 100%; min-height: 235px; display: block; object-fit: cover; }
.venture-cover-preview > div { min-height: 235px; display: grid; place-items: center; align-content: center; gap: 10px; color: #6c8193; }
.venture-cover-preview > div span { font-size: 12px; font-weight: 800; }
.venture-cover-copy { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-content: center; padding: 28px; }
.venture-cover-copy h2 { margin: 0 0 6px; font-family: var(--font-manrope),sans-serif; font-size: 22px; }
.venture-cover-copy p { margin: 0; color: #687d8f; font-size: 13px; line-height: 1.65; }
.venture-cover-copy .btn { grid-column: 2; justify-self: start; margin-top: 4px; }
.venture-cover-success,.venture-cover-error { display: block; margin-top: 9px; font-weight: 800; }
.venture-cover-success { color: #4f7c2f; }
.venture-cover-error { color: #b23f3f; }

@media (max-width: 820px) {
  .venture-directory-card { grid-template-columns: 1fr; min-height: 0; }
  .venture-directory-visual { min-height: 250px; }
  .venture-directory-visual > img,.venture-directory-visual-fallback { min-height: 250px; max-height: 290px; }
  .venture-directory-visual-icon { right: 24px; top: auto; bottom: -28px; }
  .venture-directory-content { padding: 32px 22px 24px; }
  .venture-cover-editor { grid-template-columns: 1fr; }
  .venture-cover-preview,.venture-cover-preview > img,.venture-cover-preview > div { min-height: 210px; }
  .venture-cover-copy { padding: 22px; }
}
'''
          path.write_text(text)
          PY

      - name: Commit production hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/CreateProfileForm.tsx components/VentureWorkspace.tsx components/AdminDashboard.tsx components/DiscoverClient.tsx app/ventures.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: stabilize ventures and redesign venture cards"
          git push origin HEAD:main
