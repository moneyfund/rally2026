name: Apply card polish

on:
  push:
    paths:
      - ".github/workflows/card-polish.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply card polish
        run: python scripts/apply-card-polish.py
      - name: Commit polished cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/DiscoverClient.tsx app/marketplace.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "style: warm venture imagery and navy card borders"
            git push origin main
          fi
